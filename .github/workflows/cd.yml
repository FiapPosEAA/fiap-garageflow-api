name: CD API Kubernetes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-garageflow-api
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'garage_flow_eks' }}
  ECR_REPOSITORY: garageflow-api
  NAMESPACE: garage-flow-namespace
  DEPLOYMENT: garage-flow-deployment

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Ensure ECR repository
        run: aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || aws ecr create-repository --repository-name "$ECR_REPOSITORY" >/dev/null
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - uses: azure/setup-kubectl@v4
      - run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
      - name: Deploy
        env:
          DB_CONNECTION: ${{ secrets.DEFAULT_CONNECTION }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" create secret generic garage-flow-secrets \
            --from-literal=ConnectionStrings__DefaultConnection="$DB_CONNECTION" \
            --from-literal=Jwt__Key="$JWT_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -
          sed -i "s|image: garageflow-api:placeholder|image: $IMAGE|" k8s/deployment.yml
          sed -i "s|tags.datadoghq.com/version: .*|tags.datadoghq.com/version: \"${GITHUB_SHA::7}\"|" k8s/deployment.yml
          kubectl apply -f k8s/
          kubectl -n "$NAMESPACE" rollout status "deployment/$DEPLOYMENT" --timeout=300s
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get pods -o wide || true
          kubectl -n "$NAMESPACE" logs "deployment/$DEPLOYMENT" --tail=80 || true
